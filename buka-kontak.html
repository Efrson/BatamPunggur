<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memuat Data...</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #4F46E5; --bg: #F8FAFC; --card-bg: #FFFFFF; --text-main: #0F172A; --text-muted: #64748B; --border: #E2E8F0; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 480px; padding: 30px 20px; }
        .back-button { display: inline-block; text-decoration: none; color: var(--primary); font-weight: 600; font-size: 16px; margin-bottom: 20px; }
        .header { margin-bottom: 20px; position: relative;}
        .header h1 { font-size: 22px; font-weight: 700; margin-bottom: 5px;}
        .header p { font-size: 14px; color: var(--text-muted); margin-bottom: 15px;}
        
        .btn-add-contact {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px; /* Disesuaikan agar rapi dengan kotak pencarian */
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.2);
        }
        .btn-add-contact:active { transform: scale(0.98); }

        /* --- STYLING KOTAK PENCARIAN (LIVE SEARCH) --- */
        .search-wrapper { position: relative; margin-bottom: 20px; }
        .search-icon { position: absolute; left: 14px; top: 12px; font-size: 16px; }
        .search-input { 
            width: 100%; padding: 12px 12px 12px 40px; border-radius: 10px; 
            border: 1px solid var(--border); font-family: inherit; font-size: 14px; 
            background-color: #FFFFFF; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            transition: all 0.2s ease;
        }
        .search-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,0.1); }
        /* ------------------------------------------- */

        .contact-card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid var(--border); }
        .card-header h2 { font-size: 18px; color: var(--text-main); margin-bottom: 5px; }
        .badge-lokasi { display: inline-block; background-color: #EEF2FF; color: var(--primary); font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-bottom: 8px; }
        .address { font-size: 13px; color: var(--text-muted); line-height: 1.4; margin-bottom: 15px; }
        .phone-box { display: flex; justify-content: space-between; align-items: center; background-color: #EEF2FF; padding: 12px 15px; border-radius: 10px; margin-bottom: 15px; }
        .phone-number { font-weight: 700; font-size: 16px; color: var(--primary); }
        .btn-copy { background-color: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .btn-copy:active { background-color: #3730A3; transform: scale(0.95); }
        
        .history-box { background-color: #F8FAFC; padding: 15px; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 15px; }
        .history-box strong { display: block; font-size: 14px; color: var(--text-main); margin-bottom: 10px; }
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-item { background-color: #ffffff; border-left: 4px solid #10B981; padding: 10px 12px; border-radius: 6px; font-size: 13px; color: #334155; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .history-item.old { border-left-color: #94A3B8; background-color: #F1F5F9; box-shadow: none; }
        .history-date { display: block; font-size: 11px; color: #64748B; font-weight: 700; margin-bottom: 4px; }
        
        hr { border: 0; height: 1px; background: var(--border); margin: 20px 0; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .form-control { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; background-color: #F8FAFC; }
        .form-control:focus { outline: none; border-color: var(--primary); }
        .btn-save { width: 100%; background-color: #10B981; color: white; border: none; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-save:active { background-color: #059669; transform: scale(0.98); }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); z-index: 1000;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background-color: white; padding: 25px; border-radius: 16px;
            width: 90%; max-width: 400px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h2 { font-size: 18px; }
        .btn-close { background: none; border: none; font-size: 24px; cursor: pointer; color: #64748B;}
    </style>
</head>
<body>

    <div class="app-container">
        <a href="javascript:history.back()" class="back-button">← Kembali</a>

        <div class="header">
            <h1 id="judul-lokasi">Lokasi: ...</h1>
            <p id="sub-judul">Daftar kontak wilayah ...</p>
        </div>

        <button class="btn-add-contact" onclick="bukaModal()">+ Tambah Kontak Baru</button>

        <!-- FITUR PENCARIAN (LIVE SEARCH) -->
        <div class="search-wrapper" id="kolom-pencarian" style="display: none;">
            <span class="search-icon">🔍</span>
            <input type="text" id="input-cari" class="search-input" placeholder="Cari nama, blok, atau no HP..." oninput="filterKontak()">
        </div>

        <div id="kontak-container"></div>
    </div>

    <!-- Modal Kontak Baru -->
    <div class="modal-overlay" id="modalBaru">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tambah Kontak Baru</h2>
                <button class="btn-close" onclick="tutupModal()">×</button>
            </div>
            
            <div class="input-group">
                <label>Nama Penghuni / Tempat</label>
                <input type="text" class="form-control" id="new-nama" placeholder="Contoh: Bpk. Budi">
            </div>
            <div class="input-group">
                <label>Nomor HP / Telepon</label>
                <input type="tel" class="form-control" id="new-hp" placeholder="Contoh: 08123456789">
            </div>
            <div class="input-group">
                <label>Alamat Lengkap</label>
                <textarea class="form-control" id="new-alamat" rows="2" placeholder="Contoh: Blok C3 No. 12"></textarea>
            </div>
            <div class="input-group">
                <label>Ditambahkan Oleh (Nama Petugas)</label>
                <input type="text" class="form-control" id="new-petugas" placeholder="Kosongkan jika ingin pakai nama sebelumnya...">
            </div>

            <button class="btn-save" id="btn-simpan-baru" onclick="simpanKontakBaru()">Simpan Kontak Baru</button>
        </div>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbz0SilOvw3vXtOnieFFv-vfXIq15vbrSAIgTuE4tPHxZLhEJLVxeXVYP1pI-2KI4tzF8g/exec";

        const urlParams = new URLSearchParams(window.location.search);
        const filterLokasi = urlParams.get('lokasi'); 
        const namaJudul = urlParams.get('judul');     
        const namaGrup = urlParams.get('grup');       

        if(!filterLokasi) { window.location.href = "index.html"; }

        document.title = "Data Kontak - " + namaJudul;
        document.getElementById('judul-lokasi').textContent = "Lokasi: " + namaJudul;
        document.getElementById('sub-judul').textContent = "Daftar kontak wilayah " + namaJudul;

        // --- FUNGSI LIVE SEARCH ---
        function filterKontak() {
            let input = document.getElementById('input-cari').value.toLowerCase();
            let cards = document.getElementsByClassName('contact-card');

            for (let i = 0; i < cards.length; i++) {
                let nama = cards[i].querySelector('h2').innerText.toLowerCase();
                let alamat = cards[i].querySelector('.address').innerText.toLowerCase();
                let hp = cards[i].querySelector('.phone-number').innerText.toLowerCase();
                
                // Jika nama, alamat, atau nomor HP mengandung kata kunci yang diketik
                if (nama.includes(input) || alamat.includes(input) || hp.includes(input)) {
                    cards[i].style.display = "block";
                } else {
                    cards[i].style.display = "none";
                }
            }
        }
        // -------------------------

        function bukaModal() { 
            document.getElementById('modalBaru').style.display = 'flex'; 
            let savedName = localStorage.getItem("namaPetugas");
            if(savedName) {
                document.getElementById('new-petugas').value = savedName;
            }
        }
        function tutupModal() { document.getElementById('modalBaru').style.display = 'none'; }

        async function simpanKontakBaru() {
            const nama = document.getElementById('new-nama').value;
            const hp = document.getElementById('new-hp').value;
            const alamat = document.getElementById('new-alamat').value;
            let inputPetugas = document.getElementById('new-petugas').value.trim();

            if(!nama || !hp) {
                alert("Mohon isi Nama dan Nomor HP!"); return;
            }

            let petugasFinal = inputPetugas || localStorage.getItem("namaPetugas") || "Anonim";
            localStorage.setItem("namaPetugas", petugasFinal);

            if(!localStorage.getItem("deviceId")) {
                let uniqueId = 'dev_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
                localStorage.setItem("deviceId", uniqueId);
            }
            const idPerangkat = localStorage.getItem("deviceId");

            const btn = document.getElementById('btn-simpan-baru');
            btn.innerText = "⏳ Menyimpan...";
            btn.disabled = true;
            btn.style.backgroundColor = "#94A3B8";

            const formData = new URLSearchParams();
            formData.append('action', 'tambah_kontak'); 
            formData.append('token', 'KeluargaBatam2026');
            formData.append('petugas', petugasFinal);
            formData.append('deviceId', idPerangkat);
            formData.append('grup', namaGrup); 
            formData.append('wilayah', namaJudul); 
            formData.append('nama', nama);
            formData.append('hp', hp);
            formData.append('alamat', alamat);

            try {
                let response = await fetch(URL_APPS_SCRIPT, { method: 'POST', body: formData });
                let resData = await response.json();

                if (resData.status === "blocked") {
                    alert("🚫 " + resData.message);
                    btn.innerText = "Simpan Kontak Baru";
                    btn.disabled = false;
                    btn.style.backgroundColor = "#10B981";
                    return;
                }

                alert("Kontak baru berhasil disimpan!");
                location.reload(); 
            } catch(e) {
                alert("Gagal menyimpan data.");
                btn.innerText = "Simpan Kontak Baru";
                btn.disabled = false;
                btn.style.backgroundColor = "#10B981";
            }
        }

        async function muatData() {
            const container = document.getElementById('kontak-container');
            container.innerHTML = "<p style='text-align:center;'>⏳ Harap Tunggu...</p>";

            if(!localStorage.getItem("deviceId")) {
                let uniqueId = 'dev_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
                localStorage.setItem("deviceId", uniqueId);
            }
            const idPerangkat = localStorage.getItem("deviceId");

            try {
                let response = await fetch(URL_APPS_SCRIPT + "?grup=" + encodeURIComponent(namaGrup) + "&deviceId=" + encodeURIComponent(idPerangkat));
                let data = await response.json();

                if (data.status === "blocked") {
                    container.innerHTML = "<div style='text-align:center; padding:40px;'><h3 style='color:#EF4444; font-size:20px;'>🚫 Akses Ditolak</h3><p style='color:#64748B; margin-top:8px;'>Perangkat Anda tidak memiliki izin untuk mengakses data ini.</p></div>";
                    return;
                }
                
                let master = data.master; 
                let kontakBaru = data.kontakBaru;
                let laporan = data.laporan; 

                container.innerHTML = ""; 

                let semuaKontak = [];

                for (let i = 1; i < master.length; i++) {
                    let lokasiMaster = master[i][1] ? master[i][1].toString().trim().toLowerCase() : "";
                    let namaMaster = master[i][2];

                    if (!namaMaster) continue;
                    if (!lokasiMaster.includes(filterLokasi.trim().toLowerCase())) continue;

                    semuaKontak.push({
                        lokasi: master[i][1],
                        nama: namaMaster,
                        alamat: master[i][3],
                        hp: master[i][4],
                        kodeLama: master[i][5],
                        ketLama: master[i][6],
                        isBaru: false,
                        origIndex: i
                    });
                }

                if (kontakBaru && kontakBaru.length > 1) {
                    for (let k = 1; k < kontakBaru.length; k++) {
                        let rowTimestamp = kontakBaru[k][0] ? kontakBaru[k][0].toString().split('T')[0] : "-";
                        let rowGrup = kontakBaru[k][1] ? kontakBaru[k][1].toString().trim() : "";
                        let rowWilayah = kontakBaru[k][2] ? kontakBaru[k][2].toString().trim().toLowerCase() : "";
                        let rowNama = kontakBaru[k][3];
                        let rowHp = kontakBaru[k][4];
                        let rowAlamat = kontakBaru[k][5];
                        let rowPetugas = kontakBaru[k][6] || "Manual";

                        if (!rowNama) continue;

                        if (rowGrup === namaGrup && rowWilayah.includes(filterLokasi.trim().toLowerCase())) {
                            semuaKontak.push({
                                lokasi: kontakBaru[k][2],
                                nama: "[BARU] " + rowNama,
                                alamat: rowAlamat || "-",
                                hp: rowHp,
                                kodeLama: "-",
                                ketLama: `Dibuat manual tgl ${rowTimestamp} oleh ${rowPetugas}`,
                                isBaru: true,
                                origIndex: "baru_" + k
                            });
                        }
                    }
                }

                if (semuaKontak.length === 0) {
                    container.innerHTML = "<p style='text-align:center; color:#64748B;'>Belum ada data kontak di wilayah ini.</p>";
                    return;
                }

                // Munculkan kotak pencarian jika data kontak berhasil dimuat dan jumlahnya lebih dari 0
                document.getElementById('kolom-pencarian').style.display = "block";

                for (let idx = 0; idx < semuaKontak.length; idx++) {
                    let item = semuaKontak[idx];
                    let lokasi = item.lokasi;
                    let nama = item.nama;
                    let alamat = item.alamat;
                    let hp = item.hp;
                    let kodeLama = item.kodeLama;
                    let ketLama = item.ketLama;
                    let i = item.origIndex;

                    let adaUpdateBaru = false;
                    let historiHTML = `
                        <div class="history-item old">
                            <span class="history-date">${item.isBaru ? 'Informasi Kontak Baru' : 'Data Lama (2020-2022)'}</span>
                            <b>[${item.isBaru ? '-' : (kodeLama || '-')}]</b> ${ketLama}
                        </div>
                    `;

                    for (let j = 1; j < laporan.length; j++) {
                        let namaBersih = nama.replace("[BARU] ", "").trim();
                        let laporanNamaBersih = laporan[j][2] ? laporan[j][2].toString().replace("[BARU] ", "").trim() : "";

                        if (laporanNamaBersih === namaBersih) { 
                            adaUpdateBaru = true;
                            let rawTgl = laporan[j][3];
                            let tgl = rawTgl ? rawTgl.toString().split('T')[0] : "-"; 
                            let status = laporan[j][4];
                            let ket = laporan[j][5];

                            historiHTML += `
                                <div class="history-item">
                                    <span class="history-date">Update: ${tgl}</span>
                                    <b>[${status}]</b> ${ket}
                                </div>
                            `;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'contact-card';
                    
                    if(adaUpdateBaru) {
                        card.style.borderColor = "#10B981";
                        card.style.backgroundColor = "#F0FDF4";
                    }

                    if(item.isBaru) {
                        card.style.borderLeft = "6px solid #4F46E5"; 
                    }

                    // FUNGSI PEMBERSIH KUTIP & APOSTROF UNTUK TOMBOL SIMPAN (Bulletproof)
                    let namaAman = nama.replace(/\[BARU\] /g, "").replace(/"/g, '&quot;').replace(/'/g, '\\\'').trim();
                    let lokasiAman = lokasi.replace(/"/g, '&quot;').replace(/'/g, '\\\'').trim();

                    card.innerHTML = `
                        <div class="card-header">
                            <span class="badge-lokasi">${lokasi}</span>
                            <h2>${nama}</h2>
                            <p class="address">📍 ${alamat}</p>
                        </div>
                        
                        <div class="phone-box">
                            <span class="phone-number">📞 ${hp}</span>
                            <button class="btn-copy" onclick="copyNomor('${hp}')">Salin</button>
                        </div>

                        <div class="history-box">
                            <strong>Riwayat Status / Catatan:</strong>
                            <div class="history-list">
                                ${historiHTML}
                            </div>
                        </div>

                        <hr>

                        <div class="input-section">
                            <div class="input-group">
                                <label>Tanggal Kunjungan (Input Baru)</label>
                                <input type="date" class="form-control" id="tanggal-${i}" value="">
                            </div>
                            
                            <div class="input-group">
                                <label>Kode Baru</label>
                                <select class="form-control" id="kode-${i}">
                                    <option value="">-- Pilih Kode --</option>
                                    <option value="TM">TM - Tidak masuk</option>
                                    <option value="TA">TA - Tidak angkat</option>
                                    <option value="BB">BB - Bisa bicara</option>
                                    <option value="TS">TS - Tulis surat</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label>Keterangan Baru</label>
                                <textarea class="form-control" rows="2" id="ket-${i}" placeholder="Ketik hasil panggilan..."></textarea>
                            </div>

                            <!-- TOMBOL SIMPAN YANG SUDAH KEBAL TANDA KUTIP -->
                            <button class="btn-save" onclick="simpanData(event, '${i}', '${namaAman}', '${lokasiAman}')">Simpan / Tambah Data Baru</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            } catch (error) {
                console.error(error);
                container.innerHTML = "<p style='text-align:center; color:red;'>Gagal memuat data. Periksa koneksi atau URL Apps Script.</p>";
            }
        }

        function copyNomor(nomor) {
            navigator.clipboard.writeText(nomor).then(() => { alert("Nomor " + nomor + " disalin!"); });
        }

        async function simpanData(event, index, nama, lokasiDetail) {
            const tanggal = document.getElementById('tanggal-' + index).value;
            const kode = document.getElementById('kode-' + index).value;
            const ket = document.getElementById('ket-' + index).value;
            
            if(!tanggal || !kode) { alert("Mohon isi Tanggal dan Kode!"); return; }

            const petugasAktif = localStorage.getItem("namaPetugas") || "Anonim";
            
            if(!localStorage.getItem("deviceId")) {
                let uniqueId = 'dev_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
                localStorage.setItem("deviceId", uniqueId);
            }
            const idPerangkat = localStorage.getItem("deviceId");

            const tombolSimpan = event.target;
            const teksAsli = tombolSimpan.innerText;
            tombolSimpan.innerText = "⏳ Mengirim...";
            tombolSimpan.disabled = true;
            tombolSimpan.style.backgroundColor = "#94A3B8";

            const formData = new URLSearchParams();
            formData.append('token', 'KeluargaBatam2026'); 
            formData.append('petugas', petugasAktif);      
            formData.append('deviceId', idPerangkat);     
            formData.append('grup', namaGrup); 
            formData.append('wilayah', lokasiDetail); 
            formData.append('nama', nama);
            formData.append('tanggal', tanggal);
            formData.append('kode', kode);
            formData.append('keterangan', ket);

            try {
                let response = await fetch(URL_APPS_SCRIPT, { method: 'POST', body: formData });
                let resData = await response.json();

                if (resData.status === "blocked") {
                    alert("🚫 " + resData.message);
                    tombolSimpan.innerText = teksAsli;
                    tombolSimpan.disabled = false;
                    tombolSimpan.style.backgroundColor = "#10B981";
                    return;
                }

                alert("Data berhasil ditambahkan ke riwayat!");
                muatData(); 
            } catch (error) {
                alert("Gagal mengirim data. Periksa koneksi internet.");
                tombolSimpan.innerText = teksAsli;
                tombolSimpan.disabled = false;
                tombolSimpan.style.backgroundColor = "#10B981";
            }
        }

        muatData();
    </script>
</body>
</html>
