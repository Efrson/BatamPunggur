<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daerah Telepon Sidang Batam Punggur</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5; 
            --bg: #F8FAFC; 
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 480px; 
            padding: 40px 20px;
        }

        .header {
            margin-bottom: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 700;
            line-height: 1.3;
            background: linear-gradient(135deg, #4F46E5, #0EA5E9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 15px;
            color: var(--text-muted);
        }

        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Gaya Kartu Tombol yang Baru (Teks di Tengah) */
        .kdl-card {
            display: flex;
            align-items: center;
            justify-content: center; /* Memposisikan teks ke tengah */
            background-color: var(--card-bg);
            padding: 22px 20px; /* Padding sedikit diperbesar */
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 600;
            font-size: 18px; /* Ukuran font lebih besar */
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.04);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid rgba(226, 232, 240, 0.6);
            text-align: center;
        }

        .kdl-card:active {
            transform: scale(0.96);
            background-color: #F1F5F9;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <h1>Daerah Telepon Sidang<br>Batam Punggur</h1>
            <p>Pilih wilayah KDL untuk mulai menelepon</p>
        </div>

        <div class="menu-list">
            <!-- Ubah href menjadi pesona-asri.html -->
            <a href="pesona-asri.html" class="kdl-card">Pesona Asri</a>
            <a href="nongsa.html" class="kdl-card">Nongsa</a>
            <a href="punggur.html" class="kdl-card">Punggur</a>
            <a href="simpang-raya.html" class="kdl-card">Simpang Raya</a>
        </div>

        <!-- TOMBOL PANDUAN DI PALING BAWAH MENU -->
        <div style="text-align: center; margin-top: 40px; margin-bottom: 20px;">
            <a href="panduan.html" style="color: #4F46E5; font-size: 14px; text-decoration: underline; font-weight: 600;">Panduan Penggunaan</a>
        </div>
    </div>

    <!-- Modal Pengenalan Nama (Hanya muncul sekali di HP baru) -->
    <div id="modalIdentitas" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:white; padding:25px; border-radius:16px; width:90%; max-width:360px; text-align:center;">
            <h3 style="margin-bottom:10px; font-size:18px;">Selamat Datang! 👋</h3>
            <p style="font-size:14px; color:#64748B; margin-bottom:15px;">Silahkan masukkan nama saudara/i terlebih dahulu</p>
            <input type="text" id="inputNamaUser" class="form-control" placeholder="Nama Saudara/i" style="margin-bottom:15px; width:100%; padding:12px; border:1px solid #E2E8F0; border-radius:8px;">
            <button onclick="simpanIdentitasUser()" style="width:100%; background:#4F46E5; color:white; border:none; padding:12px; border-radius:8px; font-weight:700; cursor:pointer;">Simpan & Mulai</button>
        </div>
    </div>

    <script>
        // Cek apakah perangkat ini sudah punya nama dan ID
        function cekIdentitasPerangkat() {
            let savedName = localStorage.getItem("namaPetugas");
            if (!savedName) {
                document.getElementById('modalIdentitas').style.display = 'flex';
            }
        }

        function simpanIdentitasUser() {
            let namaInput = document.getElementById('inputNamaUser').value.trim();
            if(!namaInput) {
                alert("Mohon masukkan nama Anda!");
                return;
            }
            
            // Simpan Nama
            localStorage.setItem("namaPetugas", namaInput);
            
            // Buat ID Perangkat Unik secara otomatis jika belum ada
            if(!localStorage.getItem("deviceId")) {
                let uniqueId = 'dev_' + Math.random().toString(36).substring(2, 10) + Date.now().toString(36);
                localStorage.setItem("deviceId", uniqueId);
            }

            document.getElementById('modalIdentitas').style.display = 'none';
            alert("Halo " + namaInput + ", perangkat Anda siap digunakan!");
        }

        // Jalankan saat halaman dibuka
        cekIdentitasPerangkat();
    </script>

</body>
</html>
